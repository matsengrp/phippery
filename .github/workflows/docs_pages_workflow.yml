name: docs_pages_workflow
 
# execute this workflow automatically when we push to main, and on PRs to
# main so a broken docs build gates the PR instead of only failing after merge
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
 
  build_docs_job:
    runs-on: ubuntu-latest
    # container: debian:bookworm-slim
    container: debian:bookworm
    strategy:
      matrix:
        python-version: ["3.12"]
 
    steps:

        #    - uses: actions/checkout@v3
        #    - name: Set up Python ${{ matrix.python-version }}
        #      uses: actions/setup-python@v4
        #      with:
        #        python-version: ${{ matrix.python-version }}
        #    - name: Install dependencies
        #      run: |
        #        python -m pip install --upgrade pip
        #    - name: Install phippery
        #      run: |
        #          pip install -e ".[dev]"
 
    - name: Prereqs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        apt-get update
        apt-get install -y git python3-pip
        git clone --depth 1 "https://token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
        git config --global --add safe.directory /__w/phippery/phippery
      shell: bash

        # TODO, do we really need to install phippery? 
        # could we just install all the other pre-reqs

    - name: Install phippery
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # debian:bookworm marks its system Python as externally managed
        # (PEP 668), so pip refuses to install into it without this flag.
        # This job builds docs in a throwaway container, so installing into
        # system Python is fine and keeps sphinx on PATH for buildDocs.sh.
        python3 -m pip install --upgrade --break-system-packages pip
        python3 -m pip install --break-system-packages -e ".[dev]"
      shell: bash

    - name: Execute script to build our documentation and update pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "docs/buildDocs.sh"
      shell: bash
